name: offline_bible
description: A fast, elegant, and fully offline Bible app with audio playback, reading plans, customizable themes, and study tools.

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+2

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.2
  flutter_native_splash: ^2.3.8
  get: ^4.6.5
  substring_highlight: ^1.0.33
  scrollable_positioned_list: ^0.3.1
  hive_ce: ^2.19.1
  hive_ce_flutter: ^2.3.4
  intl: ^0.20.2
  package_info_plus: ^10.2.1
  share_plus: ^13.3.0
  wakelock_plus: ^1.4.0
  flutter_tts: ^4.2.5
  audio_service: ^0.18.19
  http: ^1.2.0
  crypto: ^3.0.6
  path_provider: ^2.1.4

# Icon sources live in branding/, not assets/, because they are only read at
# build time by the two generators below. Anything under assets/ is bundled
# into the shipped app, and these never need to be.
# Regenerate them from the vector geometry with ./branding/src/build.sh
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "branding/app_logo.png"
  min_sdk_android: 21
  remove_alpha_ios: true

  adaptive_icon_foreground: "branding/app_logo_foreground.png"
  adaptive_icon_background: "branding/app_logo_background.png"
  adaptive_icon_foreground_inset: 0
  # Android 13+ themed icons: silhouette only, recoloured by the system.
  adaptive_icon_monochrome: "branding/app_logo_monochrome.png"

  # iOS 18 light/dark/tinted appearances.
  image_path_ios_dark_transparent: "branding/app_logo_transparent.png"
  image_path_ios_tinted_grayscale: "branding/app_logo_transparent.png"
  desaturate_tinted_to_grayscale_ios: true

  # macOS and web were still shipping the stock Flutter icon.
  macos:
    generate: true
    image_path: "branding/app_logo_macos.png"

  web:
    generate: true
    image_path: "branding/app_logo.png"
    background_color: "#000000"
    theme_color: "#000000"

flutter_native_splash:
  color: "#000000"
  # Transparent mark rather than the full black tile, so nothing shows a seam
  # against the splash colour.
  image: branding/app_logo_splash.png

  android_12:
    # Android 12+ masks the splash icon to a circle showing only the inner
    # two thirds, so this one is pre-inset like the adaptive foreground.
    image: branding/app_logo_splash_android12.png
    icon_background_color: "#000000"

  web: false

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

  # No Hive code generator here on purpose. Every box is a plain
  # Box<dynamic> of primitives and maps, so there are no @HiveType models
  # and nothing to generate. If typed adapters are ever added, bring back
  # `hive_ce_generator` and `build_runner` — not the pre-CE `hive_generator`,
  # which depends on the old `hive` package and pins analyzer below 7.

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/
    - assets/fonts/OFL.txt

  # Every reading font ships as an asset so text renders with no network at
  # all. Only the Regular weight is bundled; Flutter synthesizes bolder
  # weights, which keeps the download small and the app fully offline.
  # Reading faces, bundled so text renders with no network at all. Each family
  # ships a real 700 weight rather than relying on Flutter's synthetic bold,
  # which smears at small sizes on long passages.
  fonts:
    - family: Lato
      fonts:
        - asset: assets/fonts/Lato-Regular.ttf
        - asset: assets/fonts/Lato-Bold.ttf
          weight: 700
    - family: Raleway
      fonts:
        - asset: assets/fonts/Raleway-Regular.ttf
        - asset: assets/fonts/Raleway-Bold.ttf
          weight: 700
    - family: Open Sans
      fonts:
        - asset: assets/fonts/OpenSans-Regular.ttf
        - asset: assets/fonts/OpenSans-Bold.ttf
          weight: 700
    - family: Atkinson Hyperlegible
      fonts:
        - asset: assets/fonts/AtkinsonHyperlegible-Regular.ttf
        - asset: assets/fonts/AtkinsonHyperlegible-Bold.ttf
          weight: 700
    - family: Merriweather
      fonts:
        - asset: assets/fonts/Merriweather-Regular.ttf
        - asset: assets/fonts/Merriweather-Bold.ttf
          weight: 700
    - family: Quattrocento
      fonts:
        - asset: assets/fonts/Quattrocento-Regular.ttf
        - asset: assets/fonts/Quattrocento-Bold.ttf
          weight: 700
    - family: EB Garamond
      fonts:
        - asset: assets/fonts/EBGaramond-Regular.ttf
        - asset: assets/fonts/EBGaramond-Bold.ttf
          weight: 700
    - family: Literata
      fonts:
        - asset: assets/fonts/Literata-Regular.ttf
        - asset: assets/fonts/Literata-Bold.ttf
          weight: 700
    - family: Lora
      fonts:
        - asset: assets/fonts/Lora-Regular.ttf
        - asset: assets/fonts/Lora-Bold.ttf
          weight: 700
    - family: OpenDyslexic
      fonts:
        - asset: assets/fonts/OpenDyslexic-Regular.otf
        - asset: assets/fonts/OpenDyslexic-Bold.otf
          weight: 700
