name: Release Pipeline

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: Build Android Artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Static code analysis
        run: flutter analyze --fatal-infos

      - name: Run tests
        run: flutter test

      - name: Set up release keystore (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            cat > android/key.properties <<EOF
          storeFile=$RUNNER_TEMP/upload.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
            echo "Using release keystore from secrets."
          else
            echo "No keystore secrets found; building with fallback debug signing."
          fi

      - name: Build Android App Bundle (.aab)
        run: >
          flutter build appbundle --release
          --obfuscate --split-debug-info=build/symbols/android

      - name: Build Universal Android APK (.apk)
        run: >
          flutter build apk --release
          --obfuscate --split-debug-info=build/symbols/android

      - name: Read version
        id: version
        run: echo "version=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)" >> "$GITHUB_OUTPUT"

      - name: Stage Android artifacts
        run: |
          mkdir -p dist
          cp build/app/outputs/bundle/release/app-release.aab \
            "dist/offline-bible-${{ steps.version.outputs.version }}.aab"
          cp build/app/outputs/flutter-apk/app-release.apk \
            "dist/offline-bible-${{ steps.version.outputs.version }}.apk"
          (cd build/symbols && zip -r - android) \
            > "dist/android-symbols-${{ steps.version.outputs.version }}.zip"

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-artifacts
          path: dist/*

  ios:
    name: Build iOS Archive
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Static code analysis
        run: flutter analyze --fatal-infos

      - name: Run tests
        run: flutter test

      - name: Build iOS archive (unsigned)
        run: >
          flutter build ipa --release --no-codesign
          --obfuscate --split-debug-info=build/symbols/ios

      - name: Read version
        id: version
        run: echo "version=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)" >> "$GITHUB_OUTPUT"

      - name: Stage iOS artifacts
        run: |
          mkdir -p dist
          (cd build/ios/archive && zip -r - Runner.xcarchive) \
            > "dist/ios-xcarchive-${{ steps.version.outputs.version }}.zip"
          (cd build/symbols && zip -r - ios) \
            > "dist/ios-symbols-${{ steps.version.outputs.version }}.zip"

      - name: Upload iOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-artifacts
          path: dist/*

  macos:
    name: Build macOS Desktop
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build macOS app
        run: >
          flutter build macos --release
          --obfuscate --split-debug-info=build/symbols/macos

      - name: Read version
        id: version
        run: echo "version=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)" >> "$GITHUB_OUTPUT"

      - name: Stage macOS artifacts
        run: |
          mkdir -p dist
          (cd build/macos/Build/Products/Release && zip -r - "Offline Bible.app") \
            > "dist/macos-app-${{ steps.version.outputs.version }}.zip"

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-artifacts
          path: dist/*

  web:
    name: Build Web Bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Web distribution
        run: flutter build web --release --base-href "/"

      - name: Read version
        id: version
        run: echo "version=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)" >> "$GITHUB_OUTPUT"

      - name: Stage Web artifacts
        run: |
          mkdir -p dist
          (cd build/web && zip -r - .) > "dist/web-bundle-${{ steps.version.outputs.version }}.zip"

      - name: Upload Web artifacts
        uses: actions/upload-artifact@v4
        with:
          name: web-artifacts
          path: dist/*

  publish-release:
    name: Publish GitHub Release
    needs: [android, ios, macos, web]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          draft: false
          prerelease: false
