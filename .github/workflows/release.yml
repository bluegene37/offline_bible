name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      # Optional Play upload signing. Without these secrets the build falls
      # back to debug signing (fine for verifying the pipeline, not for Play).
      - name: Set up release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            cat > android/key.properties <<EOF
          storeFile=$RUNNER_TEMP/upload.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
            echo "Using release keystore from secrets."
          else
            echo "No keystore secrets; building with debug signing."
          fi

      - name: Build app bundle
        run: >
          flutter build appbundle --release
          --obfuscate --split-debug-info=build/symbols/android

      - name: Read version
        id: version
        run: echo "version=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)" >> "$GITHUB_OUTPUT"

      - name: Stage artifacts
        run: |
          mkdir -p dist
          cp build/app/outputs/bundle/release/app-release.aab \
            "dist/offline-bible-${{ steps.version.outputs.version }}.aab"
          (cd build/symbols && zip -r - android) \
            > "dist/android-symbols-${{ steps.version.outputs.version }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      # CI has no Apple signing identity; --no-codesign produces an unsigned
      # .xcarchive that proves the build. The store .ipa is built locally
      # with Xcode automatic signing (see RELEASING.md).
      - name: Build iOS archive (unsigned)
        run: >
          flutter build ipa --release --no-codesign
          --obfuscate --split-debug-info=build/symbols/ios

      - name: Read version
        id: version
        run: echo "version=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)" >> "$GITHUB_OUTPUT"

      - name: Stage artifacts
        run: |
          mkdir -p dist
          (cd build/ios/archive && zip -r - Runner.xcarchive) \
            > "dist/ios-xcarchive-${{ steps.version.outputs.version }}.zip"
          (cd build/symbols && zip -r - ios) \
            > "dist/ios-symbols-${{ steps.version.outputs.version }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: dist/*

  release:
    needs: [android, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
