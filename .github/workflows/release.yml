#           (cd build/ios/archive && zip -r - Runner.xcarchive) \
#             > "dist/ios-xcarchive-${{ steps.version.outputs.version }}.zip"
#           (cd build/symbols && zip -r - ios) \
#             > "dist/ios-symbols-${{ steps.version.outputs.version }}.zip"
# 
#       - name: Upload iOS artifacts
#         uses: actions/upload-artifact@v4
#         with:
#           name: ios-artifacts
#           path: dist/*
  ios:
    name: Build & Deploy iOS (TestFlight)
    if: ${{ github.event_name == 'push' || github.event.inputs.platform == 'all' || github.event.inputs.platform == 'ios' || github.event.inputs.platform == '' }}
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Static code analysis
        run: flutter analyze --fatal-infos

      - name: Run tests
        run: flutter test

      - name: Import Apple Distribution Certificate
        if: env.P12_BASE64 != ''
        uses: apple-actions/import-codesign-certs@v3
        env:
          P12_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
        with:
          p12-file-base64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          p12-password: ${{ secrets.P12_PASSWORD }}

      - name: Install Apple Provisioning Profile
        if: env.PROVISION_PROFILE_BASE64 != ''
        env:
          PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
        run: |
          PP_TEMP="$RUNNER_TEMP/profile.mobileprovision"
          echo "$PROVISION_PROFILE_BASE64" | base64 --decode > "$PP_TEMP"
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          UUID=$(security cms -D -i "$PP_TEMP" | plutil -extract UUID raw -)
          PROFILE_NAME=$(security cms -D -i "$PP_TEMP" | plutil -extract Name raw -)
          cp "$PP_TEMP" ~/Library/MobileDevice/Provisioning\ Profiles/"$UUID.mobileprovision"
          echo "Installed Profile: $PROFILE_NAME (UUID: $UUID)"
          echo "profile_uuid=$UUID" >> "$GITHUB_ENV"
          echo "profile_name=$PROFILE_NAME" >> "$GITHUB_ENV"

      - name: Generate ExportOptions.plist
        run: |
          cat <<EOF > ios/ExportOptions.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>
              <key>teamID</key>
              <string>T7LB768N2Z</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>destination</key>
              <string>export</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>dev.genexis.offlinebible</key>
                  <string>${profile_name}</string>
              </dict>
              <key>manageAppVersionAndBuildNumber</key>
              <false/>
          </dict>
          </plist>
          EOF
          echo "Generated ios/ExportOptions.plist"

      - name: Build iOS Archive (unsigned)
        run: |
          if [ "${{ github.event.inputs.auto_increment_build }}" != "false" ]; then
            VERSION_NAME=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)
            BUILD_NUMBER=$(( 10 + ${{ github.run_number }} ))
            echo "Building $VERSION_NAME+$BUILD_NUMBER"
            flutter build ipa --release --no-codesign \
              --build-name="$VERSION_NAME" \
              --build-number="$BUILD_NUMBER" \
              --obfuscate --split-debug-info=build/symbols/ios
          else
            flutter build ipa --release --no-codesign \
              --obfuscate --split-debug-info=build/symbols/ios
          fi

      - name: Export and Sign IPA
        if: env.P12_BASE64 != ''
        env:
          P12_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
        run: |
          xcodebuild -exportArchive \
            -archivePath build/ios/archive/Runner.xcarchive \
            -exportPath build/ios/ipa \
            -exportOptionsPlist ios/ExportOptions.plist

      - name: Locate IPA file
        id: find_ipa
        run: |
          IPA_PATH=$(find build/ios/ipa -name "*.ipa" 2>/dev/null | head -n 1)
          if [ -n "$IPA_PATH" ]; then
            echo "Found IPA file at: $IPA_PATH"
            echo "ipa_path=$IPA_PATH" >> "$GITHUB_OUTPUT"
          else
            echo "No signed IPA found."
          fi

      - name: Upload to TestFlight (optional)
        if: steps.find_ipa.outputs.ipa_path != '' && env.APPSTORE_PRIVATE_KEY != ''
        uses: apple-actions/upload-testflight-build@v5
        env:
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
        with:
          app-path: ${{ steps.find_ipa.outputs.ipa_path }}
          issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_PRIVATE_KEY }}

      - name: Read version
        id: version
        run: echo "version=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)" >> "$GITHUB_OUTPUT"

      - name: Stage iOS artifacts
        run: |
          mkdir -p dist
          if [ -n "${{ steps.find_ipa.outputs.ipa_path }}" ]; then
            cp "${{ steps.find_ipa.outputs.ipa_path }}" "dist/offline-bible-${{ steps.version.outputs.version }}.ipa"
          fi
          (cd build/ios/archive && zip -r - Runner.xcarchive) \
            > "dist/ios-xcarchive-${{ steps.version.outputs.version }}.zip"
          (cd build/symbols && zip -r - ios) \
            > "dist/ios-symbols-${{ steps.version.outputs.version }}.zip"

      - name: Upload iOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-artifacts
          path: dist/*

# Gene - Oct 09, 2026: Restrict desktop build to version tags v* so manual mobile dispatches skip it
#   macos:
#     name: Build macOS Desktop
#     runs-on: macos-latest
  macos:
    name: Build macOS Desktop
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build macOS app
        run: >
          flutter build macos --release
          --obfuscate --split-debug-info=build/symbols/macos

      - name: Read version
        id: version
        run: echo "version=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)" >> "$GITHUB_OUTPUT"

      - name: Stage macOS artifacts
        run: |
          mkdir -p dist
          (cd build/macos/Build/Products/Release && zip -r - "Offline Bible.app") \
            > "dist/macos-app-${{ steps.version.outputs.version }}.zip"

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-artifacts
          path: dist/*

# Gene - Oct 09, 2026: Restrict web build to version tags v* so manual mobile dispatches skip it
#   web:
#     name: Build Web Bundle
#     runs-on: ubuntu-latest
  web:
    name: Build Web Bundle
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Web distribution
        run: flutter build web --release --base-href "/"

      - name: Read version
        id: version
        run: echo "version=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)" >> "$GITHUB_OUTPUT"

      - name: Stage Web artifacts
        run: |
          mkdir -p dist
          (cd build/web && zip -r - .) > "dist/web-bundle-${{ steps.version.outputs.version }}.zip"

      - name: Upload Web artifacts
        uses: actions/upload-artifact@v4
        with:
          name: web-artifacts
          path: dist/*

  publish-release:
    name: Publish GitHub Release
    needs: [android, ios, macos, web]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          draft: false
          prerelease: false
