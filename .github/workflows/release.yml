name: Release Pipeline

# Gene - Oct 09, 2026: Added workflow_dispatch inputs for platform (all, ios, android), track (alpha, internal), and build number auto-increment
# on:
#   push:
#     tags:
#       - "v*"
#   workflow_dispatch:
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      platform:
        description: 'Target platform to build and deploy'
        type: choice
        options:
          - all
          - ios
          - android
        default: 'all'
      track:
        description: 'Google Play Track for Android (alpha = Closed Testing, internal = Internal Testing)'
        type: choice
        options:
          - alpha
          - internal
        default: 'alpha'
      auto_increment_build:
        description: 'Use GitHub run number as build number (avoids duplicate versionCode/CFBundleVersion)'
        type: boolean
        default: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
# Gene - Oct 09, 2026: Conditional execution based on platform selection input
#   android:
#     name: Build Android Artifacts
#     runs-on: ubuntu-latest
  android:
    name: Build & Deploy Android
    if: ${{ github.event_name == 'push' || github.event.inputs.platform == 'all' || github.event.inputs.platform == 'android' || github.event.inputs.platform == '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Static code analysis
        run: flutter analyze --fatal-infos

      - name: Run tests
        run: flutter test

      - name: Set up release keystore (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            cat > android/key.properties <<EOF
          storeFile=$RUNNER_TEMP/upload.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
            echo "Using release keystore from secrets."
          else
            echo "No keystore secrets found; building with fallback debug signing."
          fi

# Gene - Oct 09, 2026: Added auto-increment build number support using run_number
#       - name: Build Android App Bundle (.aab)
#         run: >
#           flutter build appbundle --release
#           --obfuscate --split-debug-info=build/symbols/android
      - name: Build Android App Bundle (.aab)
        run: |
          if [ "${{ github.event.inputs.auto_increment_build }}" != "false" ]; then
            VERSION_NAME=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)
            BUILD_NUMBER=$(( 10 + ${{ github.run_number }} ))
            echo "Building $VERSION_NAME+$BUILD_NUMBER"
            flutter build appbundle --release \
              --build-name="$VERSION_NAME" \
              --build-number="$BUILD_NUMBER" \
              --obfuscate --split-debug-info=build/symbols/android
          else
            flutter build appbundle --release \
              --obfuscate --split-debug-info=build/symbols/android
          fi

      - name: Build Universal Android APK (.apk)
        run: >
          flutter build apk --release
          --obfuscate --split-debug-info=build/symbols/android

      - name: Read version
        id: version
        run: echo "version=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)" >> "$GITHUB_OUTPUT"

      - name: Stage Android artifacts
        run: |
          mkdir -p dist
          cp build/app/outputs/bundle/release/app-release.aab \
            "dist/offline-bible-${{ steps.version.outputs.version }}.aab"
          cp build/app/outputs/flutter-apk/app-release.apk \
            "dist/offline-bible-${{ steps.version.outputs.version }}.apk"
          (cd build/symbols && zip -r - android) \
            > "dist/android-symbols-${{ steps.version.outputs.version }}.zip"

# Gene - Oct 09, 2026: Parameterized Google Play track (alpha / internal) via track input
#       - name: Upload to Google Play Internal Track (optional)
#         if: env.PLAY_JSON != ''
#         uses: r0adkll/upload-google-play@v1
#         env:
#           PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
#         with:
#           serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
#           packageName: dev.genexis.offlinebible
#           releaseFiles: build/app/outputs/bundle/release/app-release.aab
#           tracks: internal
#           status: completed
      - name: Upload to Google Play Track (optional)
        if: env.PLAY_JSON != ''
        uses: r0adkll/upload-google-play@v1
        env:
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: dev.genexis.offlinebible
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          tracks: ${{ github.event.inputs.track || 'alpha' }}
          status: completed

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-artifacts
          path: dist/*

