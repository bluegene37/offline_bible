name: 🐛 Bug Report
description: Report an issue, rendering glitch, or unexpected behavior in Offline Bible.
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug! Please ensure you have checked existing issues before submitting.

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      description: What operating system or platform did you encounter this issue on?
      options:
        - Android
        - iOS
        - macOS
        - Web
        - Other
    validations:
      required: true

  - type: input
    id: app_version
    attributes:
      label: App Version / Build Number
      description: E.g., 1.0.0+1 (found in Settings -> About or pubspec)
      placeholder: "1.0.0+1"
    validations:
      required: true

  - type: input
    id: os_version
    attributes:
      label: Device & OS Version
      description: E.g., Google Pixel 8 (Android 14) or iPhone 15 Pro (iOS 17.5)
      placeholder: "e.g., Pixel 8, Android 14"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: reproduction_steps
    attributes:
      label: Steps to Reproduce
      description: Step-by-step instructions to reproduce the issue.
      placeholder: |
        1. Open chapter 'John 1'
        2. Tap audio play button
        3. Lock screen
        4. See audio stops / crashes
    validations:
      required: true

  - type: textarea
    id: expected_behavior
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual_behavior
    attributes:
      label: Actual Behavior
      description: What actually happened?
    validations:
      required: true

  - type: textarea
    id: logs_or_screenshots
    attributes:
      label: Logs or Screenshots
      description: Paste any error messages, logs (`flutter run -v`), or drag-and-drop screenshots.
