name: 💡 Feature Proposal
description: Suggest a new feature, reading plan, typography option, or enhancement for Offline Bible.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting a feature! Please check existing issues and PRs to see if your idea is already being discussed.

  - type: dropdown
    id: category
    attributes:
      label: Feature Category
      options:
        - Reader Experience & Typography
        - Audio Bible / TTS
        - Notes, Highlights & Study Tools
        - Search & Navigation
        - Reading Plans & Devotionals
        - Translations & Scripture Formats
        - Platform / Performance
        - Other
    validations:
      required: true

  - type: textarea
    id: problem_statement
    attributes:
      label: Problem Statement / Motivation
      description: Is your feature request related to a problem or limitation? Please describe clearly.
      placeholder: "I find it difficult to..."
    validations:
      required: true

  - type: textarea
    id: proposed_solution
    attributes:
      label: Proposed Solution
      description: Describe the solution you would like to see implemented.
    validations:
      required: true

  - type: textarea
    id: alternatives_considered
    attributes:
      label: Alternatives Considered
      description: Describe any alternative solutions or features you considered.

  - type: textarea
    id: additional_context
    attributes:
      label: Additional Context
      description: Add any mockups, screenshots, or other context about the feature request.
